<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Pierre Bermudez — Front-End / Full-Stack Developer">
<style>
  .grow-x { transform-box: fill-box; transform-origin: left; animation: grow-x 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .grow-y { transform-box: fill-box; transform-origin: bottom; animation: grow-y 1s cubic-bezier(.2,.8,.2,1) both; }
  .reveal { animation: fade-in .3s ease-out both; }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow-x { from { transform: scaleX(0); } }
  @keyframes grow-y { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F5C518"/>
  <stop offset=".5" stop-color="#F59418"/>
  <stop offset="1" stop-color="#E85D04"/>
</linearGradient><linearGradient id="brand-deep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#C99A0A"/>
  <stop offset=".5" stop-color="#C46F0B"/>
  <stop offset="1" stop-color="#A84203"/>
</linearGradient></defs>
  <style>
    .wave-back { animation: wave-back 16s linear infinite; }
    @keyframes wave-back { to { transform: translateX(-600px); } }
  </style>
  <clipPath id="wave-back"><path class="wave-back" d="M0,214 q150,-28 300,0 t300,0 t300,0 t300,0 t300,0 t300,0 V0 H0 Z"/></clipPath>
  <rect width="1200" height="250" fill="url(#brand-deep)" clip-path="url(#wave-back)"/>
  <style>
    .wave-front { animation: wave-front 10s linear infinite; }
    @keyframes wave-front { to { transform: translateX(-400px); } }
  </style>
  <clipPath id="wave-front"><path class="wave-front" d="M0,198 q100,-28 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V0 H0 Z"/></clipPath>
  <rect width="1200" height="250" fill="url(#brand)" clip-path="url(#wave-front)"/>
  <text x="600" y="92" class="rise" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="#0D1117" letter-spacing="1">Pierre Bermudez</text>
  <text x="600" y="130" class="rise" style="animation-delay:.2s" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#0D1117" fill-opacity=".75" letter-spacing="5">FRONT-END / FULL-STACK DEVELOPER</text>
  <clipPath id="tagline">
    <rect x="400.20000000000005" y="152" width="399.59999999999997" height="25.2" class="grow-x" style="animation: grow-x 2.2199999999999998s steps(37) 0.9s both"/>
  </clipPath>
  <text x="400.20000000000005" y="170" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#0D1117" textLength="399.59999999999997" clip-path="url(#tagline)">&gt; I build interfaces that make sense.</text>
  <rect x="803.8" y="155.6" width="9.9" height="18" fill="#0D1117" style="animation: fade-in 0s 3.1199999999999997s both, blink 1.1s steps(1) 3.1199999999999997s infinite"/>
</svg>
