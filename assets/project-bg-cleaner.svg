<svg xmlns="http://www.w3.org/2000/svg" width="524" height="206" viewBox="0 0 524 206" role="img" aria-label="BG Cleaner — Remove &amp; edit image backgrounds in one click">
<style>
  .grow-x { transform-box: fill-box; transform-origin: left; animation: grow-x 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .grow-y { transform-box: fill-box; transform-origin: bottom; animation: grow-y 1s cubic-bezier(.2,.8,.2,1) both; }
  .reveal { animation: fade-in .3s ease-out both; }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow-x { from { transform: scaleX(0); } }
  @keyframes grow-y { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<clipPath id="wrapper-clip"><path d="M0,-1 H525 V207 H0 Z"/></clipPath>
<g clip-path="url(#wrapper-clip)">
  <defs>
    <radialGradient id="wrapper-halo-0" gradientUnits="userSpaceOnUse" cx="524" cy="250" r="560" gradientTransform="translate(0 -1674) translate(524 250) scale(1 0.45) translate(-524 -250)">
    <stop offset="0" stop-color="#10B981" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
    <radialGradient id="wrapper-halo-1" gradientUnits="userSpaceOnUse" cx="524" cy="3034" r="560" gradientTransform="translate(0 -1674) translate(524 3034) scale(1 0.45) translate(-524 -3034)">
    <stop offset="0" stop-color="#10B981" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
    <pattern id="wrapper-dots" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="translate(0 -1674)">
      <circle cx="12" cy="12" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <path d="M0,-1 H525 V207 H0 Z" fill="#12161D"/>
  <path d="M0,-1 H525 V207 H0 Z" fill="url(#wrapper-halo-0)"/>
  <path d="M0,-1 H525 V207 H0 Z" fill="url(#wrapper-halo-1)"/>
  <path d="M0,-1 H525 V207 H0 Z" fill="url(#wrapper-dots)"/>
  <g transform="translate(24 16)"><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#BEF264"/>
  <stop offset=".5" stop-color="#4ADE80"/>
  <stop offset="1" stop-color="#10B981"/>
</linearGradient></defs>
  <rect x=".5" y=".5" width="491" height="189" rx="12" fill="#161B22" stroke="#30363D"/>
  <text x="32" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#E6EDF3">BG Cleaner <tspan fill="#BEF264" font-size="20">↗</tspan></text>
  <text x="460" y="56" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E"><tspan class="pulse" fill="#3FB950">●</tspan> Live</text>
  <text x="32" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8B949E">Remove &amp; edit image backgrounds in one click</text>
  <text x="32" y="144" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#BEF264">React · React Router · Tailwind · Vercel</text>
  <rect x="32" y="162" width="428" height="3" rx="1.5" fill="url(#brand)" class="grow-x"/></g>
</g>
<path d="M.5,0 V206" fill="none" stroke="#30363D"/>
</svg>
