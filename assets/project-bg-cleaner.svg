<svg xmlns="http://www.w3.org/2000/svg" width="500" height="190" viewBox="0 0 500 190" role="img" aria-label="BG Cleaner — Remove &amp; edit image backgrounds in one click">
<style>
  .grow-x { transform-box: fill-box; transform-origin: left; animation: grow-x 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .grow-y { transform-box: fill-box; transform-origin: bottom; animation: grow-y 1s cubic-bezier(.2,.8,.2,1) both; }
  .reveal { animation: fade-in .3s ease-out both; }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow-x { from { transform: scaleX(0); } }
  @keyframes grow-y { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F5C518"/>
  <stop offset=".5" stop-color="#F59418"/>
  <stop offset="1" stop-color="#E85D04"/>
</linearGradient></defs>
  <rect x=".5" y=".5" width="499" height="189" rx="12" fill="#161B22" stroke="#30363D"/>
  <text x="32" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#E6EDF3">BG Cleaner <tspan fill="#F5C518" font-size="20">↗</tspan></text>
  <text x="468" y="56" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#8B949E"><tspan class="pulse" fill="#3FB950">●</tspan> Live</text>
  <text x="32" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#8B949E">Remove &amp; edit image backgrounds in one click</text>
  <text x="32" y="144" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#F5C518">React · React Router · Tailwind · Vercel</text>
  <rect x="32" y="162" width="436" height="3" rx="1.5" fill="url(#brand)" class="grow-x"/>
</svg>
