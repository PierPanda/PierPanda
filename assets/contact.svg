<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Pierre Bermudez — Let&#39;s grab a coffee. A project? A mission? A question?">
<style>
  .grow-x { transform-box: fill-box; transform-origin: left; animation: grow-x 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .grow-y { transform-box: fill-box; transform-origin: bottom; animation: grow-y 1s cubic-bezier(.2,.8,.2,1) both; }
  .reveal { animation: fade-in .3s ease-out both; }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow-x { from { transform: scaleX(0); } }
  @keyframes grow-y { from { transform: scaleY(0); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steam { animation: steam 2.4s ease-in-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }</style>
<defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F5C518"/>
  <stop offset=".5" stop-color="#F59418"/>
  <stop offset="1" stop-color="#E85D04"/>
</linearGradient></defs>
  <rect x=".5" y=".5" width="999" height="239" rx="12" fill="#161B22" stroke="#30363D"/>
  <style>
    .border-glint { animation: border-glint 8.46s linear infinite; }
    @keyframes border-glint { to { stroke-dashoffset: -2453.1; } }
  </style>
  <defs><linearGradient id="border-glint-gradient" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F5C518"/>
  <stop offset=".5" stop-color="#F59418"/>
  <stop offset="1" stop-color="#E85D04"/>
</linearGradient></defs>
  <rect class="border-glint" x="1" y="1" width="998" height="238" rx="11" fill="none" stroke="url(#border-glint-gradient)" stroke-width="2" stroke-linecap="round" stroke-dasharray="160 2293.1"/>
  <clipPath id="avatar-clip"><circle cx="136" cy="120" r="72"/></clipPath>
  <image href="data:image/jpeg;base64," x="64" y="48" width="144" height="144" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="136" cy="120" r="82" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" stroke-dasharray="360 155" class="spin"/>
  <text x="262" y="70" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15"><tspan fill="#F5C518">pierre@github</tspan> <tspan fill="#8B949E">~</tspan> <tspan fill="#E85D04">$</tspan> <tspan fill="#E6EDF3">./contact --coffee</tspan></text>
  <text x="260" y="122" class="rise" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#E6EDF3">Let's grab a coffee</text>
  <text x="262" y="160" class="rise" style="animation-delay:.15s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8B949E">A project? A mission? A question?</text>
  <text x="262" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8B949E"><tspan class="pulse" fill="#3FB950">●</tspan> Open to opportunities and projects</text>
  <g transform="translate(836 64)">
    <path d="M22,38 c-8,-9 8,-17 0,-26 c-8,-9 8,-17 0,-26" fill="none" stroke="#8B949E" stroke-width="3" stroke-linecap="round" stroke-opacity=".6" class="steam" style="animation-delay:0s"/><path d="M40,38 c-8,-9 8,-17 0,-26 c-8,-9 8,-17 0,-26" fill="none" stroke="#8B949E" stroke-width="3" stroke-linecap="round" stroke-opacity=".6" class="steam" style="animation-delay:0.7s"/><path d="M58,38 c-8,-9 8,-17 0,-26 c-8,-9 8,-17 0,-26" fill="none" stroke="#8B949E" stroke-width="3" stroke-linecap="round" stroke-opacity=".6" class="steam" style="animation-delay:1.4s"/>
    <path d="M80,60 h8 a14,14 0 0 1 0,28 h-8" fill="none" stroke="#E85D04" stroke-width="7"/>
    <path d="M0,50 h80 v34 a28,28 0 0 1 -28,28 h-24 a28,28 0 0 1 -28,-28 Z" fill="url(#brand)"/>
    <rect x="-14" y="116" width="122" height="6" rx="3" fill="#30363D"/>
  </g>
</svg>
